# OmniSpace AI v2.3.1 全局配置（文档 §7）
app:
  version: "2.3.1"

server:
  host: "127.0.0.1"  # §14约束2: 仅本地，不可更改
  port: 5800
  # 仅回环绑定的单用户桌面应用：前端多页面/多标签页合法轮询（0.5~1Hz/端点）
  # 叠加即超 100/min，产生误伤 429（表现为状态刷新失败、按钮偶发无响应）。
  # 提升至 300/min（≈5 req/s，仍可拦截失控重试循环）。
  rate_limit: 300  # requests/minute per endpoint

scheduler:
  sample_interval_ms: 1000   # 调度循环 tick 间隔（基频）
  # 分级采样间隔（秒）：低频指标不随 tick 重复采集，降低 psutil/NVML 开销
  gpu_sample_interval_s: 2   # GPU 显存/利用率/温度
  cpu_sample_interval_s: 5   # CPU 利用率/温度
  disk_sample_interval_s: 10 # 磁盘 IO/余量
  hysteresis_seconds: 30  # 滞回控制
  # 两级空闲回收（P2 分级，原单档 300s 粒度粗）：
  #   shallow_reclaim_seconds 60 → 表层：释放 embed/aux/voice 小模型（快速可重载）
  #   idle_reclaim_seconds    300 → 深层：卸载非常驻大模型释放显存
  shallow_reclaim_seconds: 60
  idle_reclaim_seconds: 300
  # 对话引擎空闲看门狗（2026-09-05 方案A）：对话模型就绪且全系统空闲
  # 达此阈值 → 正规卸载链自动还显存（vLLM KV 预分配池约 5.5GB 不卸不清）；
  # 0=禁用；下次对话自动重载（约 1-2 分钟，进度弹窗）
  dialog_idle_unload_seconds: 900
  # 阈值表已对齐文档B §4.1（审计 BK-023）：
  #   GPU 显存 > 90%        → 降低模型精度 / 卸载非活跃模型（critical=0.90）
  #   GPU 利用率 > 95% 持续10s → 降低生成质量参数（critical=0.95 + sustained_s=10）
  #   CPU > 90%             → 暂停后台学习 / 降低标签页数（critical=0.90）
  #   内存 > 85%（已用）     → 清理缓存 / 减少 ChromaDB 缓存
  #                           （即可用 ≤15%：mem_critical_ratio=0.15）
  #   磁盘 IO > 80%         → 延迟非关键写入（disk_io_busy_critical=0.80）
  # warning 线为动作线之前的预警余量（工程值，文档未规定）。
  thresholds:
    gpu_vram_warning: 0.80
    gpu_vram_critical: 0.90
    gpu_vram_force_unload: 0.95
    gpu_util_warning: 0.85
    gpu_util_critical: 0.95
    # GPU 利用率越线持续秒数拆两档（P2 分级降参）：
    #   mild_s 越线 5s → 轻度降参（在途任务 steps×0.67）
    #   deep_s 越线 15s → 深度降档（在途任务 steps×0.4）
    # 10s 单档过长，超高频生成空转体验差。
    gpu_util_mild_sustained_s: 5
    gpu_util_deep_sustained_s: 15
    # S4 滞回（2026-08-28）：持续越线窗口允许短暂回落——低于临界线
    # 未连续满 4s（=2 个 GPU 采样周期，TTL 2s）不清零已累积时长，
    # 避免步间/镜间空隙的单采样抖动把 5s/15s 窗口打回零致 level 抖动。
    gpu_util_reset_grace_s: 4
    gpu_temp_warning: 85
    gpu_temp_critical: 90
    cpu_util_warning: 0.80
    cpu_util_critical: 0.90
    cpu_temp_warning: 85
    cpu_temp_critical: 95
    mem_warning_ratio: 0.25   # 可用内存占比预警线（=已用 75%）
    mem_critical_ratio: 0.15  # 可用内存占比临界线（=已用 85%，文档B §4.1 动作线）
    disk_io_busy_critical: 0.80  # 磁盘忙碌时间占比临界（文档B §4.1：>80% 延迟写入）
    battery_pause_training: 20  # percent

model_cache:
  l2_max_gb: 0  # 0 = 自动（可用RAM - 4GB）
  compression: "lz4"
  eviction_policy: "lru"

database:
  path: "{app_dir}/data/omnispace.db"
  # 诚实标注：无 encryption 项——SQLCipher 未启用（死代码已移除），
  # 明文 SQLite，仅本地 127.0.0.1 运行（规格 §14 约束1/2）。
  wal_mode: true
  busy_timeout_ms: 10000
  # 写同步模式（性能优化）：WAL 下 NORMAL 为标准推荐——数据库不会损坏，
  # 仅在断电时可能丢失最近一笔已提交事务（应用崩溃仍安全）。如需严格
  # 逐笔同步落盘可改 FULL（写延迟上升）。本地创作数据丢失容忍度较高。
  synchronous: NORMAL
  # SQLite 页缓存上限（KB，负值表示页数）。提升读缓存可减少重复磁盘读，
  # 内存成本按页面大小计，受 85% RAM 硬顶约束；默认 16MB。
  cache_size_kb: 16384

# 诚实标注：Redis 未部署/未启用。以下为文档 §7.1 架构中的目标形态，
# 当前实现为进程内缓存（backend/data/cache.py），无外部 Redis 依赖。
redis:
  enabled: false
  host: "127.0.0.1"
  port: 6379
  watchdog: false

# 诚实标注：Celery 未部署/未启用。以下为文档 §7.1 架构中的目标形态，
# 当前实现为进程内 PriorityQueue 四级优先队列模拟 Celery 语义
# （见 backend/services/lora_training_service.py 头部迁移路径说明）。
celery:
  enabled: false
  queues: ["high", "normal", "low"]
  worker_max_tasks: 100  # 每100任务重启防内存泄漏
  task_acks_late: true

video:
  default_codec: "h264"
  supported_codecs: ["h264", "h265", "vp9", "av1"]
  ltx2_max_audio_sync_seconds: 10
  max_duration_seconds: 20

dialog:
  max_context_tokens: 8192  # 上下文窗口（需求文档 UI 规格：上下文[8192]；超出走截断策略）
  max_input_chars: 32768  # 单条消息字符上限（DoS 防护，超出返回 40002）
  # 单次 prefill 的输入 token 上限（16GB 显存安全线）：
  # generate() 首步对全部位置计算 logits（151K 词表），7K token 约需 6.5GB 瞬时显存，
  # 叠加 bf16 权重 ~8GB 后打满 16GB 引发分配器颠簸（prefill 卡死）。3072 内峰值 ~12GB。
  max_prefill_tokens: 3072
  stream_chunk_size: 4  # tokens per WebSocket message

paint:
  default_steps: 20
  default_guidance: 7.5
  max_batch_size: 4

# ComfyUI 子进程生命周期（2026-08-31 抢占治理；进程统一由
# backend/services/inference/comfy_proc.py 管理：Job Object 与后端
# 共生死 + atexit + 空闲自动关闭 + 模块切换按需终止）
comfyui:
  # 空闲自动关闭：最后一个生成任务结束后 N 秒无新任务 → 杀进程
  # （释放 CUDA context 数百 MB 显存 + torch GB 级常驻 RAM；冷启动
  # ~40s）。0 = 禁用（进程常驻热启动）
  idle_shutdown_seconds: 300

manga:
  # 2026-08-23 用户裁定 50 → 200：剧本字数放宽 10000 字后，5000 字≈87 镜，
  # 10000 字≈170 镜，50 行上限直接阻断导入
  max_storyboard_rows: 200
  panorama_resolutions: [1024, 2048, 4096, 8192]
  camera_presets: ["正面", "侧面", "背面", "特写", "全景"]
  pose_presets_count: 15
  voice_preset_emotions: ["默认", "愤怒", "悲伤"]

# 磁盘可用空间阈值（P2 统一口径，单一来源：launcher / startup_check / installer
# 均从此处读取，不再各自硬编码）。
# 语义拆分（对应三处不同入口的判定，数值为审计后基准）：
#   start_min_gb      20 → 启动最低可用空间（launcher 启动预检 _check_disk_space）
#   models_min_gb     50 → 含模型部署可运行（startup_check 项14 磁盘可用空间）
#   installer_min_gb 500 → 安装器完整包所需（完整安装前置检查）
disk:
  start_min_gb: 20
  models_min_gb: 50
  installer_min_gb: 500

installer:
  full_size_gb: 390
  base_size_gb: 5
  # 磁盘门槛已统一收敛到 disk.installer_min_gb（P2 统一口径），不再在 installer 下重复定义

# 多卡与设备策略（P3 §5.3）：默认单卡；双卡辅助卸载仅显式开启并做可用性校验，
# 避免错误路由变慢（方案风险控制）。enumerate_gpus 枚举全部 NVIDIA 设备；
# primary_device 为主计算卡；secondary_offload=true 且 auxiliary_device 有效且
# 与主卡不同时，才把视频等大任务的 embed/aux 辅助部分压到辅助卸载卡。
gpu:
  primary_device: 0
  auxiliary_device: 1
  secondary_offload: false

logging:
  level: "INFO"
  max_file_size_mb: 10
  max_files: 5
  sensitive_fields: ["api_key", "password"]  # 脱敏

ui:
  # 《OmniSpace AI v2.3.1中文版》§6.3.1 Sakura 暗色主题（权威色板）
  theme: "sakura"
  primary_color: "#FF6B9D"
  font: "Source Han Sans"
  font_size_body: 14
  font_size_small: 12
  ai_generated_bg: "#E3F2FD"
  zoom_levels: [1.0, 1.5, 2.0, 3.0, 4.0]
