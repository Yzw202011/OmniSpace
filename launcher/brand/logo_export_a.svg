<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DF5FF"/>
      <stop offset="1" stop-color="#5EEAFF"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#05080F"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 圆角深底瓦片（ico/任务栏导出专用：星点遮罩在实底上隐形） -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect x="5" y="5" width="246" height="246" rx="52" fill="none"
        stroke="rgba(94,234,255,.22)" stroke-width="3"/>
  <!-- 星门 mark（缩放居中） -->
  <g transform="translate(28.2,28.2) scale(0.78)">
    <polygon points="128,42 202.5,85 202.5,171 128,214 53.5,171 53.5,85"
             fill="none" stroke="url(#ga)" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="128" cy="128" r="13" fill="#E9F1FF" filter="url(#glow)"/>
    <circle cx="165" cy="63.5" r="27" fill="#05080F"/>
    <circle cx="165" cy="63.5" r="15" fill="#FFB454" filter="url(#glow)"/>
  </g>
</svg>
