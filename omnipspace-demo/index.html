<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniSpace AI - 纯前端演示版</title>
<link rel="stylesheet" href="./styles/tokens/tokens.css">
<!-- Mock 层必须在所有业务脚本之前加载，拦截 fetch -->
<script src="./mock.js"></script>
<script src="./libs/react.production.min.js"></script>
<script src="./libs/react-dom.production.min.js"></script>
<script src="./libs/babel.min.js"></script>
<script src="./libs/tailwind.js"></script>
<script src="./libs/lucide.min.js"></script>
<script src="./libs/marked.min.js"></script>
<script src="./libs/purify.min.js"></script>
<script src="./libs/react-window.js"></script>
<script src="./libs/three.min.js"></script>
<script src="./libs/cytoscape.min.js"></script>
<script src="./config.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="./app.jsx?v=20260812"></script>
<script type="text/babel" data-presets="react" src="./m6.jsx?v=20260812"></script>
<script type="text/babel" data-presets="react" src="./director3d.jsx?v=20260812"></script>
<script type="text/babel" data-presets="react">
  // 双模块就绪后启动（app.jsx 提供 AppShell，m6.jsx 注册漫剧工作台）
  function boot() {
    if (window.AppShell && window.M6 && !window.__omni_booted) {
      window.__omni_booted = true;
      ReactDOM.createRoot(document.getElementById("root"))
        .render(React.createElement(window.AppShell));
    } else {
      setTimeout(boot, 50);
    }
  }
  boot();
</script>
</body>
</html>
