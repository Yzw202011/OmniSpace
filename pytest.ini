[pytest]
# testpaths 收口（TASK-P2-09）：pytest 只认 backend/tests；
# 根目录 tests/ 是需活后端的 E2E 流程编排脚本（定位见 tests/README.md），
# 其脚本命名无 test_ 前缀、依赖运行中后端，设计为不被本配置收集。
# 全量测试唯一入口：runtime/py310/python.exe tools/run_tests.py（--e2e 追加流程层）
testpaths = backend/tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    smoke: 冒烟测试（关键路径可用性，必须在任何提交前通过）
    schema: 数据库模式与迁移测试（拦截列缺失类事故）
filterwarnings =
    ignore::DeprecationWarning
