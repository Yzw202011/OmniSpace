# OmniSpace AI Python 代码规范（ruff 0.16+）
# 启用方式：tools/ruff/ruff.exe check backend/ （或安装 ruff 后 `ruff check`）
# 策略：E/F 全开（错误与 pyflakes），W/I 混入；规则从紧、存量违规基线化处理。

target-version = "py310"
line-length = 100
extend-exclude = ["pydeps", "runtime", "models", "frontend", "omnipspace-demo"]

[lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes（未定义名/未使用导入等真错误）
    "I",   # import 排序
    "B",   # 常见 bug 模式（如可变默认参数）
    "UP",  # pyupgrade（面向 py310 的现代写法）
]
ignore = [
    "E501",  # 行长由 line-length 软约束，formatter 统一处理
    "B008",  # FastAPI Depends() 模式依赖可变默认参数，属框架惯例
]

[lint.per-file-ignores]
"backend/tests/*" = ["B011"]  # 测试允许 assert False 语义

[format]
quote-style = "double"
indent-style = "space"
