# OmniSpace AI v2.5.0 全局配置（2026-09-17 版本勘误：实际开发线早已是 v2.5）（文档 §7）
app:
  version: "2.5.1"

server:
  host: "127.0.0.1"  # §14约束2: 仅本地，不可更改
  port: 5800
  # 仅回环绑定的单用户桌面应用：前端多页面/多标签页合法轮询（0.5~1Hz/端点）
  # 叠加即超 100/min，产生误伤 429（表现为状态刷新失败、按钮偶发无响应）。
  # 提升至 300/min（≈5 req/s，仍可拦截失控重试循环）。
  rate_limit: 300  # requests/minute per endpoint

# B5 统一任务子系统终态（2026-09-17 观察期通过，用户拍板删 legacy）：
# task_queue.impl 键已移除——image/video 队列调度一律委托通用
# TaskQueueCore（src/services/task_queue.py），无灰度开关无回退分支；
# 观察期实证（09-13~09-17：5166 任务流零事故零回退）见
# docs/audit/round-2026-09-16-root-cause-audit.md。回退=git revert。

# 插件安全模型终态（2026-09-17 用户拍板=A 分级隔离）：含源码档
# （user_source）invoke 走子进程沙箱（超时硬杀/内存上限/崩溃不连坐
# 后端，sandbox_host.py）；出厂/纯数据档维持进程内。false=应急
# 回退闸（含源码档回进程内信任，重启生效）。
plugins:
  # 安全盾行为门禁（批1-6 2026-09-18 补键：代码读此键默认 true，
  # 原先 config 无键=用户不可见的隐形开关）
  security_gate: true
  sandbox: true

scheduler:
  sample_interval_ms: 1000   # 调度循环 tick 间隔（基频）
  # 分级采样间隔（秒）：低频指标不随 tick 重复采集，降低 psutil/NVML 开销
  gpu_sample_interval_s: 2   # GPU 显存/利用率/温度
  cpu_sample_interval_s: 5   # CPU 利用率/温度
  disk_sample_interval_s: 10 # 磁盘 IO/余量
  hysteresis_seconds: 30  # 滞回控制
  # 两级空闲回收（P2 分级，原单档 300s 粒度粗）：
  #   shallow_reclaim_seconds 60 → 表层：释放 embed/aux/voice 小模型（快速可重载）
  #   idle_reclaim_seconds    300 → 深层：卸载非常驻大模型释放显存
  shallow_reclaim_seconds: 60
  idle_reclaim_seconds: 300
  # 对话引擎空闲看门狗（2026-09-05 方案A）：对话模型就绪且全系统空闲
  # 达此阈值 → 正规卸载链自动还显存（vLLM KV 预分配池约 5.5GB 不卸不清）；
  # 0=禁用；下次对话自动重载（约 1-2 分钟，进度弹窗）
  dialog_idle_unload_seconds: 900
  # 阈值表已对齐文档B §4.1（审计 BK-023）：
  #   GPU 显存 > 90%        → 降低模型精度 / 卸载非活跃模型（critical=0.90）
  #   GPU 利用率 > 95% 持续10s → 降低生成质量参数（critical=0.95 + sustained_s=10）
  #   CPU > 90%             → 暂停后台学习 / 降低标签页数（critical=0.90）
  #   内存 > 85%（已用）     → 清理缓存 / 减少 ChromaDB 缓存
  #                           （即可用 ≤15%：mem_critical_ratio=0.15）
  #   磁盘 IO > 80%         → 延迟非关键写入（disk_io_busy_critical=0.80）
  # warning 线为动作线之前的预警余量（工程值，文档未规定）。
  thresholds:
    gpu_vram_warning: 0.80
    gpu_vram_critical: 0.90
    gpu_vram_force_unload: 0.95
    gpu_util_warning: 0.85
    gpu_util_critical: 0.95
    # GPU 利用率越线持续秒数拆两档（P2 分级降参）：
    #   mild_s 越线 5s → 轻度降参（在途任务 steps×0.67）
    #   deep_s 越线 15s → 深度降档（在途任务 steps×0.4）
    # 10s 单档过长，超高频生成空转体验差。
    gpu_util_mild_sustained_s: 5
    gpu_util_deep_sustained_s: 15
    # S4 滞回（2026-08-28）：持续越线窗口允许短暂回落——低于临界线
    # 未连续满 4s（=2 个 GPU 采样周期，TTL 2s）不清零已累积时长，
    # 避免步间/镜间空隙的单采样抖动把 5s/15s 窗口打回零致 level 抖动。
    gpu_util_reset_grace_s: 4
    gpu_temp_warning: 85
    gpu_temp_critical: 90
    cpu_util_warning: 0.80
    cpu_util_critical: 0.90
    cpu_temp_warning: 85   # 唯一 CPU 温度阈值（analyzer 临界判定同用此键；
                           # cpu_temp_critical 曾登记但全仓零消费，L6 死键已摘 2026-10-25）
    mem_warning_ratio: 0.25   # 可用内存占比预警线（=已用 75%）
    mem_critical_ratio: 0.15  # 可用内存占比临界线（=已用 85%，文档B §4.1 动作线）
    mem_critical2_ratio: 0.90 # 二级内存临界（已用占比，R3-M20 补缺：resource_guard 消费但 config 此前无键=docstring 谎称可配）
    finetune_min_knowledge: 100  # 自动微调知识量下限（R3-M20 补缺：learning_scheduler:864 消费但 config 此前无键）
    disk_io_busy_critical: 0.80  # 磁盘忙碌时间占比临界（文档B §4.1：>80% 延迟写入）

model_cache:
  compression: "lz4"
  eviction_policy: "lru"

database:
  # [废] path 键 R3-L20（2026-10-24）：零模板消费（实际路径由
  # config.py DATA_DIR 硬编码），保留注释防误解
  # path: "{app_dir}/data/omnispace.db"
  # 诚实标注：无 encryption 项——SQLCipher 未启用（死代码已移除），
  # 明文 SQLite，仅本地 127.0.0.1 运行（规格 §14 约束1/2）。
  wal_mode: true
  busy_timeout_ms: 10000
  # 写同步模式（性能优化）：WAL 下 NORMAL 为标准推荐——数据库不会损坏，
  # 仅在断电时可能丢失最近一笔已提交事务（应用崩溃仍安全）。如需严格
  # 逐笔同步落盘可改 FULL（写延迟上升）。本地创作数据丢失容忍度较高。
  synchronous: NORMAL
  # SQLite 页缓存上限（KB，负值表示页数）。提升读缓存可减少重复磁盘读，
  # 内存成本按页面大小计，受 85% RAM 硬顶约束；默认 16MB。
  cache_size_kb: 16384

# G-B8（W1 2026-09-13）：redis/celery 占位节删除——两节为文档 §7.1
# 目标形态的 enabled:false 占位，全库零代码读取（grep 实证），当前
# 实现 = 进程内缓存（data/cache.py）+ 进程内 PriorityQueue，无外部依赖。

video:
  # 音画同步模式的时长上限（秒）。原名 ltx2_max_audio_sync_seconds 系
  # LTX2 时代误名（引擎已剔除、键仍被 /manga/video 真实消费），2026-09-18
  # 总账 #15 正名。改完重启后端生效。
  audio_sync_max_duration_seconds: 10
  max_duration_seconds: 20

dialog:
  max_input_chars: 32768  # 单条消息字符上限（DoS 防护，超出返回 40002）
  # 单次 prefill 的输入 token 上限（16GB 显存安全线）：
  # generate() 首步对全部位置计算 logits（151K 词表），7K token 约需 6.5GB 瞬时显存，
  # 叠加 bf16 权重 ~8GB 后打满 16GB 引发分配器颠簸（prefill 卡死）。3072 内峰值 ~12GB。
  max_prefill_tokens: 3072

paint:
  # 出图档位（批1a 2026-09-12；**2026-09-16 拍板扩三档**）：
  # fast = klein 蒸馏系原生 4 步 + cfg1.0（叠 SageAttention 双重加速，
  # A/B 实测 1280x720 46.5s→4.1s ≈11 倍，4 步有可感细节损失）；
  # balanced = 8 步 / cfg4.0（**默认档，2026-09-16 拍板**：A/B 实证
  # 8 步与 36 步目验平齐 8.2 分、快 4.2×——同种子同题 36 步 58.5s vs
  # 8 步 14.1s，证据 data/generated/images/01fb088e*/33c6acbb* +
  # logs/ab_steps_p1.json）；quality = 历史 36 步/cfg4.0。显式传
  # steps/cfg 的调用方（漫剧关键帧链 36 步）不受此档影响——关键帧
  # PuLID+多参考组合的 8 步 A/B 未做，维持 36 待验。
  preset: balanced
  # 生图引擎档（v3-W3-C 2026-09-13）：comfy=ComfyUI klein-9b-fp8 新栈
  # （分镜行预览/资产生成图/draw 链走 comfy_paint_generate，steps/cfg
  # 走上面 preset 档）；legacy=旧 diffusers klein-4b 栈。**默认 comfy
  # 已拍板切换**（A/B 实弹：分镜预览 25.0s→15.4s 暖机、draw E2E
  # 62.7s 含冷启动，质量目验达标）；四视图不受此档影响（独立开关
  # manga.turnaround_engine，实测格数遵循度 33~40% 保持 legacy）。
  gen_engine: comfy

# ComfyUI 子进程生命周期（2026-08-31 抢占治理；进程统一由
# src/services/inference/comfy_proc.py 管理：Job Object 与后端
# 共生死 + atexit + 空闲自动关闭 + 模块切换按需终止）
comfyui:
  # 空闲自动关闭：最后一个生成任务结束后 N 秒无新任务 → 杀进程
  # （释放 CUDA context 数百 MB 显存 + torch GB 级常驻 RAM；冷启动
  # ~40s）。0 = 禁用（进程常驻热启动）
  idle_shutdown_seconds: 300
  # SageAttention V7 真内核（2026-09-12 A/B：多角色格 426s→350s 提速
  # ~18%，PuLID 多角色一致性目验无损；quant 非确定性有微差风险）。
  # false 可关（回退 SDPA）。进程级开关：H3/绘画共实例同时生效。
  # 依赖：triton-windows + woct0rdho 真轮（已装，见
  # 记忆 sage-attention-v7-reopen）
  # ⚠️ 2026-10-17 关闭：本机 triton 工具链修复后 sage 真内核将首次
  # 真正生效，但 Blackwell (sm_120) 上 triton 后端 SageAttention 有
  # 社区实锤黑输出问题（Wan 系模型，ComfyUI discussion 11583），
  # FlashVSR 黑砖即同款症状。历史上此开关实际一直静默回退 SDPA
  # （triton 坏的），关闭=回到事实产线态，零速度损失。待用
  # sm_120 专用轮（nhathoangfoto/SpargeAttn 等）重评后才可开。
  use_sage_attention: false
  # H3 远景脸修复 pass（2026-09-30 方案A）：导演台每段生成后跑
  # FaceRefine v2v 链（+~400s/段）。默认 false——只应在远景/全景镜
  # 需要修脸时开。依赖 FaceRefine+NativeAudioLock 节点包与
  # sams/ultralytics/turbo LoRA 权重；缺失自动降级跳过不阻断生成
  h3_face_refine:
    enabled: true
  # H3 全局锐化 pass（2026-10-12 用户令「原生+全局锐化+FaceRefine」）：
  # 原生直出后对整帧做 CAS 对比度自适应锐化（光晕少于 unsharp），
  # 修正 720p 原生纹理在全屏播放下的感知软化——秒级 ffmpeg 滤镜，
  # 不走 ComfyUI。强度 0~1；0.6=脸(已精修)与背景(原生纹理)的平衡档，
  # 0.5=保守/0.7=进取（A/B 实测定档，见 data/h3_tune/sharpen/）。
  # 依赖 ffmpeg cas 滤镜（8.1+ 自带），缺失自动跳过不阻断
  h3_sharpen:
    enabled: true
    strength: 0.6
  # H3 逐帧放大 pass（清晰度线 2026-10-01）：导演台段生成（及可选脸
  # 修复）后做逐帧软件超分到 1344x768 交付档（+~110s/段，内容零改动）。
  # 2026-10-12 用户令关闭自动放大：视频列回归模型设置分辨率原生直出，
  # 超分改为漫剧工作台「超分视频」列按需触发（超分分辨率在模型设置选）。
  # 依赖 upscale_models/4x-UltraSharp.pth + VHS 包，缺失自动降级跳过。
  h3_frame_upscale:
    enabled: false

manga:
  # 2026-08-23 用户裁定 50 → 200：剧本字数放宽 10000 字后，5000 字≈87 镜，
  # 10000 字≈170 镜，50 行上限直接阻断导入
  max_storyboard_rows: 200
  # [废] R3-L20（2026-10-24）：三键 config.py 已删零消费方，注释化
  # panorama_resolutions: [1024, 2048, 4096, 8192]
  # camera_presets: ["正面", "侧面", "背面", "特写", "全景"]
  # pose_presets_count: 15
  voice_preset_emotions: ["默认", "愤怒", "悲伤"]
  # H3 链采样步数（批1b 2026-09-12 设 6；2026-10-11 挡位战役转正 10）：
  # 挡位战役 10 支实弹（双种子，data/h3_tune/results.jsonl）——10 步非
  # turbo 全程 18.78min 与 6 步 turbo 基线持平，中景双脸清晰、质量全面
  # 碾压（6 步 turbo 蒸馏纹理天花板=中景脸崩 2/2 种子复现）。改完重启
  # 后端生效。
  h3_steps: 10
  # H3 turbo 蒸馏链开关（2026-10-11 挡位战役新增，缺省 true=旧行为）。
  # false=官方非 turbo 基线：摘 turbo LoRA 与 Turbo 采样器，走
  # res_multistep 标准采样（shift 12/3 保留，与官方 V5/V6 双采模板同构；
  # 官方工作流目录步数=20）。战役数据：非 turbo 10/20 步质量显著优于
  # turbo 6 步。turbo=true 时 h3_steps 钳 4~8，false 时钳 8~30。
  h3_turbo: false
  # T8 双时钟采样器（P-4 2026-09-16，默认 false 待 A/B 收口）：true=H3
  # 采样段换 MiniMaxH3DualClockSamplerT8（社区口径再提速 ~100% 未独立
  # 复验；节点包 custom_nodes/comfyui-minimax-h3-audio-T8 零额外依赖）。
  # 实测 ≥30% 且质量不降才转正。改完重启后端生效。
  # 四视图引擎档（v3-W3-C 2026-09-13）：与全局 paint.gen_engine 解耦。
  # comfy 蒸馏 9B 四格构图格数遵循度实测仅 33~40% 且与步数无关
  # （丢格为构图级失败，VL 修复环不可修）——保持 legacy 直至 comfy
  # 侧多格方案（独立格生成+拼格/区域条件）验证通过。
  # Z2 2026-09-15：zviews=Z-Image 分张管线（逐视图+参考锚身份+代码贴字，语义/标注构造性正确）；回滚=改回 legacy。
  # 2026-10-03 新增 klein/onepass 档（用户令试）：跳过 qwen21/zviews 闸，直接 FLUX.2 Klein 4B 一次出四格（legacy diffusers）。
  #  10-03 实测：能出（262s 四格齐），但细节词服从（盘发/齐刘海）与速度均逊 qwen21——主力仍 qwen21，klein 留作手动档。
  turnaround_engine: zviews
  # 四视图云端档（拍板 B 2026-09-15：本地优先+云端显式选）：
  # off=本地 Z-Image（默认——旧「绑了云端端点即走云=默认烧配额」经拍板
  # 废除）；on=asset.image 槽绑定云端端点时逐视图走云旗舰。
  # 重启后端生效。
  turnaround_cloud: "off"

# 磁盘可用空间阈值（P2 统一口径，单一来源：launcher / startup_check / installer
# 均从此处读取，不再各自硬编码）。
# 语义拆分（对应三处不同入口的判定，数值为审计后基准）：
#   start_min_gb      20 → 启动最低可用空间（launcher 启动预检 _check_disk_space）
#   models_min_gb     50 → 含模型部署可运行（startup_check 项14 磁盘可用空间）
#   installer_min_gb 500 → 安装器完整包所需（完整安装前置检查）
disk:
  start_min_gb: 20
  models_min_gb: 50

# R3-L20（2026-10-24）：installer 空节已删——磁盘门槛统一在
# disk.installer_min_gb（P2 统一口径），此处零子键无消费方

# 多卡与设备策略（P3 §5.3）：默认单卡；双卡辅助卸载仅显式开启并做可用性校验，
# 避免错误路由变慢（方案风险控制）。enumerate_gpus 枚举全部 NVIDIA 设备；
# primary_device 为主计算卡；secondary_offload=true 且 auxiliary_device 有效且
# 与主卡不同时，才把视频等大任务的 embed/aux 辅助部分压到辅助卸载卡。
gpu:
  primary_device: 0
  auxiliary_device: 1
  secondary_offload: false
  # 功能→卡分配（批1 多卡地基，2026-09-05）：仅双卡及以上机器生效，
  # 单卡机器强制全部走主卡（行为与历史完全一致）。缺项=主卡；指向
  # 不存在的卡自动回落主卡并告警。paint/video_gen 共用同一 ComfyUI
  # 实例必须同卡，异卡配置会被自动收敛到 paint 的卡。
  # 例（对话占 0 卡、绘画/视频占 1 卡）：dialog: 0 / paint: 1 / video_gen: 1
  feature_devices:
    dialog: 0
    paint: 0
    video_gen: 0
    training: 0

logging:
  level: "INFO"
  max_file_size_mb: 10
  max_files: 5
  sensitive_fields: ["api_key", "password"]  # 脱敏

# API 事件日志自动兜底（自愈批2，docs/自愈与横切内建方案-2026-09-10.md §批2）
# 变更类请求/失败信封自动进用户时间线；超过 slow_request_ms 的慢请求额外记一笔
event_log:
  slow_request_ms: 3000

ui:
  # 《OmniSpace AI v2.3.1中文版》§6.3.1 Sakura 暗色主题（权威色板）

# vLLM 推理底座（V3 显存分档 2026-09-08）：
vllm:
  # sleep mode（B0 2026-09-13 实弹验证后回退默认关）：true=启动带
  # --enable-sleep-mode + sitecustomize/cudart 补丁走真睡眠让渡；
  # false=历史「杀子进程让渡」。实测 0.27.1 Windows wheel 的
  # cumem_allocator.pyd 不导出 my_malloc/my_free 符号（EngineCore
  # CUDAPluggableAllocator AttributeError），真 sleep 需上游修复或
  # 重编扩展——升级 vLLM 后把本键翻 true 重验即可（补丁已常驻）。
  sleep_mode: false
  # KV cache 量化档：""=关（默认，历史行为不变）/"auto"=FP8 能力卡
  # （计算能力≥8.9，如 5070 Ti sm_120）自动开/"fp8"=强制开。
  # FP8 KV 显存约减半（vLLM 官方 2026-04 production-ready 定调，
  # 精度损失 <1% 为外部数字，本项目以 A/B 基准把关）。
  kv_cache_dtype: "auto"
  # 对话最大上下文档位：0=默认（小权重 8K/大权重 4K 让档）；
  # 可设 16384/32768——仅对非大权重模型生效（大权重 4K 是显存
  # 安全钳制，FP8 KV 实测数据齐后再评估放开）。
  max_model_len: 16384
  # MTP 投机解码（V6 2026-09-09，D6-bis=A 拍板；批1c 2026-09-12 全量
  # 改造改常开）：true=开（9B 实测解码 +40%、输出无损）；false=关。
  # 硬约束：16GB 卡 + 9B 时 MTP+前缀缓存同开需近乎空卡（util≥0.92）；
  # 显存不足时装载会被准入线诚实拒绝（降级链兜底）。仅对带
  # model_mtp.safetensors 的模型生效（当前=qwen35-9b-w4a16）。
  # 重启后端生效。
  mtp_speculative: true

# ── 视频队列自动重试（SH-GAP-04，2026-10-21 拍板「做」）─────────────
# 本地普通视频任务（kind=local）失败后原样重入队一次（幂等：每任务
# 每进程至多 1 次）；云端任务（计费代价）与 H3 链（段内已有韧性，
# 整链重跑代价分钟级×N）绝不自动重试。false=关闭自动重试回手动。
video_auto_retry:
  enabled: true

# ── 视频显存准入硬闸（H3 blocking，2026-10-23 用户拍板「开工」）──────
# ComfyUI 不在时按 gpu_budget 硬闸判定：不足则让渡重试（默认 3×20s）
# 后诚实拒单；ComfyUI 存活时 WDDM 按进程显存不可见，按顾问放行
# （等价此前行为）。false=整链回退批2 顾问模式（误杀回滚杠杆）。
video_admission_blocking:
  enabled: true
