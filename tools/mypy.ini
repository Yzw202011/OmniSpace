# mypy 配置（批 4：编程语言规范合规·第四道防线）
# 用法见 tools/run_mypy.py；范围=backend + launcher（用户令 2026-09-04：
# packaging_console / license_console 代码冻结，不检）。
# 策略：先非 strict + 基线冻结（tools/mypy_baseline.txt，只增不减）——
# 存量报错不阻塞提交，新代码零容忍；strict 化随豁免递减另行立项。
[mypy]
python_version = 3.10
ignore_missing_imports = True
check_untyped_defs = True
no_warn_unused_configs = True
warn_redundant_casts = True

# ── F5-TTS 音色克隆链三方包豁免（问题总账 #1 / B2 批，2026-09-18）──
# f5_tts 装入后 mypy 经 voice_clone_engine 懒导入顺藤进入三方链；
# 此链为无类型三方码且 librosa 用 PEP695 语法（与 python_version=3.10 冲突），按 torch 同款跳过。
[mypy-f5_tts.*]
follow_imports = skip
ignore_errors = True
[mypy-librosa.*]
follow_imports = skip
ignore_errors = True
[mypy-vocos.*]
follow_imports = skip
ignore_errors = True
[mypy-pydub.*]
follow_imports = skip
ignore_errors = True
[mypy-x_transformers.*]
follow_imports = skip
ignore_errors = True
[mypy-torchdiffeq.*]
follow_imports = skip
ignore_errors = True
[mypy-ema_pytorch.*]
follow_imports = skip
ignore_errors = True
[mypy-rjieba.*]
follow_imports = skip
ignore_errors = True
[mypy-pypinyin.*]
follow_imports = skip
ignore_errors = True
[mypy-datasets.*]
follow_imports = skip
ignore_errors = True
[mypy-wandb.*]
follow_imports = skip
ignore_errors = True
[mypy-cached_path.*]
follow_imports = skip
ignore_errors = True
[mypy-hydra.*]
follow_imports = skip
ignore_errors = True
follow_imports = skip
ignore_errors = True

# ── 潜伏闸债豁免（B2 批顺带，2026-09-18）──
# skills/h3_convert 运行时 sys.path 注入式导入（P0 裁定，模块实际在 skills/ 下）
[mypy-convert]
ignore_missing_imports = True
[mypy-validate]
ignore_missing_imports = True
[mypy-src.build_info]
follow_imports = skip
# build_info 仅出包时由 make_dist 生成，开发树恒缺
[mypy-src.build_info]
ignore_missing_imports = True
